name: "CI: Workflows QA"

# Minimal permissions following security best practices
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
      - releases

  pull_request:
    branches:
      - main
      - master
      - releases

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: aglabo/ci-platform/.github/workflows/ru-qa-actionlint.yml@76bf81b8f8ef67234ab5d3361ba5f30e0646a284 # v0.6.1

  ghalint:
    name: Ghalint
    permissions:
      contents: read
    uses: aglabo/ci-platform/.github/workflows/ru-qa-ghalint.yml@76bf81b8f8ef67234ab5d3361ba5f30e0646a284 # v0.6.1

  actions-lock:
    name: Actions Lock
    permissions:
      contents: read
    uses: aglabo/ci-platform/.github/workflows/ru-qa-actions-lock.yml@76bf81b8f8ef67234ab5d3361ba5f30e0646a284 # v0.6.1
