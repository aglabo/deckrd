name: "CI: Scan Secrets"

# Minimal permissions following security best practices
permissions:
  contents: read

on:
  # scan all push if don't use github push protection
  push: # jactionlint ignore=duplicate-triggers

  pull_request:
    branches:
      - main
      - master
      - releases

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-betterleaks:
    name: Betterleaks Secret Scan
    permissions:
      contents: read
    uses: aglabo/ci-platform/.github/workflows/ru-scan-betterleaks.yml@76bf81b8f8ef67234ab5d3361ba5f30e0646a284 # v0.6.1
