allowBuilds:
  "@scarf/scarf": false
  esbuild: false

# blume は内部の .blume/ サンドボックスから自身の依存（astro とそのプラグイン群）を
# 解決する。pnpm 既定のシンボリックリンク型 node_modules だと .blume/ から辿れず
# 'Cannot find module astro/config' で失敗するため、npm 互換のフラット配置にする。
nodeLinker: hoisted

# esbuild は blume（内部の Astro/Vite）が使うネイティブバイナリ。ビルドスクリプトを許可する。
# fast-uri < 3.1.6 に high 深刻度の脆弱性 4 件（GHSA-jqff-g426-hqxp ほか）。
# ajv@8 が ^3.0.1 で引くため、3 系の修正版に固定する。
overrides:
  fast-uri@<3.1.6: ^3.1.7
  # @astrojs/astro2tsx が @emnapi/runtime 2.0.0-beta を引き、@emnapi/core 1.x と混ざると
  # 'this.bridge.setLastError is not a function' でビルドが落ちる。core に合わせて 1 系に固定する。
  "@emnapi/runtime": ^1.11.3
  # Dependabot #5 (GHSA-g3hv-75wg-m249): minimatch >=7 <11.0.1。glob@13 が ^10 で引くため 11 系に上げる。
  minimatch@>=7.0.0 <11.0.1: ^11.0.5
  # Dependabot #3 (GHSA-rj75-hqrm-r3gf): @tailwindcss/typography が 6.0.10 に固定しているため、6 系の修正版に上げる。
  # 6.1.6 は minimumReleaseAge 未満のため、修正を含む 6.1.5 に固定する。
  postcss-selector-parser@<6.1.5: 6.1.5
  # Dependabot #2 (GHSA-238p-pmpm-9mq7): mermaid@11 が ^0.16 で引くため、修正版の 0.18 系に上げる。
  katex@>=0.11.0 <0.18.2: ^0.18.10
  # Dependabot #6 (GHSA-r3h5-4585-7x3w): blume が ^11 で引くため、修正版の 11.1.12 以降に上げる。
  # 11.1.13 は minimumReleaseAge 未満の可能性があるため、下限を 11.1.12 とする。
  "@astrojs/node@<=11.1.11": ^11.1.12

permissions:
  blume:
    skills: [blume]

skills:
  dirs:
    - .claude/skills
