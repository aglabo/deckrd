pre-commit:
  parallel: true
  commands:
    betterleaks:
      run: betterleaks protect --config ./configs/betterleaks.toml

    # pass staged files NUL-separated so paths with "(", ")" or spaces are not parsed by sh
    secretlint:
      run: >
        git diff --cached --name-only --diff-filter=ACMR -z
        | xargs -0 -r secretlint
        --secretlintrc ./configs/secretlint.config.yaml
        --secretlintignore .gitignore
        --maskSecrets

prepare-commit-msg:
  commands:
    prepare-message-script:
      run: bash -c './scripts/prepare-commit-msg.sh --output "{1}"'

# check commit message as Conventional Commit
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: commitlint --config ./configs/commitlint.config.mjs --edit
